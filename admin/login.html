<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — AI ToolCor</title>
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c3aed'/><text x='50' y='62' text-anchor='middle' font-size='40' font-weight='800' fill='white' font-family='Arial'>A</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-page">

    <div class="login-box">
        <div class="login-logo">
            <div class="login-logo-icon">
                <i class="fas fa-robot"></i>
            </div>
            <h1>AI <span>ToolCor</span></h1>
            <p>Admin Panel</p>
        </div>

        <!-- Alert Area -->
        <div id="alertBox"></div>

        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <div class="login-input-wrap">
                    <i class="fas fa-envelope input-icon"></i>
                    <input type="email" id="email" class="form-control"
                           placeholder="Enter your email" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <div class="login-input-wrap">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="password" class="form-control"
                           placeholder="Enter your password" required>
                    <button type="button" class="password-toggle" id="togglePwd" aria-label="Show password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="login-remember">
                <label>
                    <input type="checkbox" id="remember">
                    Remember me
                </label>
                <a href="#" id="forgotLink">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i>
                <span>Sign In to Admin</span>
            </button>
        </form>

        <div class="login-footer">
            <i class="fas fa-shield-alt"></i> Secured Admin Access ·
            <a href="https://www.aitoolcor.com/" target="_blank">← Back to Website</a>
        </div>
    </div>

    <script src="js/admin.js"></script>
    <script>
        // Redirect if already logged in
        if (AdminAuth.isLoggedIn()) {
            window.location.replace('dashboard.html');
        }

        // Show/hide password
        document.getElementById('togglePwd').addEventListener('click', function() {
            const pwd = document.getElementById('password');
            const icon = this.querySelector('i');
            if (pwd.type === 'password') {
                pwd.type = 'text';
                icon.className = 'fas fa-eye-slash';
            } else {
                pwd.type = 'password';
                icon.className = 'fas fa-eye';
            }
        });

        // Forgot password
        document.getElementById('forgotLink').addEventListener('click', async function(e) {
            e.preventDefault();
            await AdminUI.confirm({
                title: 'Forgot Password?',
                message: 'Please contact your <strong>system administrator</strong> to reset your password.',
                icon: 'info',
                iconClass: 'fa-info-circle',
                confirmText: 'Got it',
                cancelText: 'Close',
                confirmClass: 'btn-primary',
            });
        });

        // Handle login
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;
            const btn = document.getElementById('loginBtn');
            const alertBox = document.getElementById('alertBox');

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> <span>Signing in...</span>';
            alertBox.innerHTML = '';

            setTimeout(() => {
                const result = AdminAuth.login(email, password, remember);

                if (result.success) {
                    alertBox.innerHTML = `
                        <div class="alert alert-success">
                            <i class="fas fa-check-circle"></i>
                            <div>Login successful! Redirecting...</div>
                        </div>`;
                    setTimeout(() => window.location.replace('dashboard.html'), 400);
                } else {
                    alertBox.innerHTML = `
                        <div class="alert alert-danger">
                            <i class="fas fa-exclamation-circle"></i>
                            <div>${result.error}</div>
                        </div>`;
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> <span>Sign In to Admin</span>';

                    const box = document.querySelector('.login-box');
                    box.style.animation = 'shake 0.4s';
                    setTimeout(() => box.style.animation = '', 500);
                }
            }, 400);
        });
    </script>
</body>
</html>
