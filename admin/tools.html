<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Tools Manager — AI ToolCor Admin</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#7c3aed">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%237c3aed'/><text x='50' y='62' text-anchor='middle' font-size='40' font-weight='800' fill='white' font-family='Arial'>A</text></svg>">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">

    <style>
        /* ── Tool Usage column ── */
        .tool-usage {
            text-align: right;
            font-size: 11px;
            min-width: 46px;
            flex-shrink: 0;
        }
        .tool-usage strong { display: block; color: var(--primary); font-size: 13px; line-height: 1; }
        .tool-usage small  { color: var(--text-light); font-size: 10px; }

        /* ── Mini badge inside tool row ── */
        .tool-mini-badge {
            font-size: 9px; font-weight: 800;
            padding: 2px 5px; border-radius: 3px;
            text-transform: uppercase; letter-spacing: 0.3px;
        }
        .tool-mini-badge.popular { background: #fef3c7; color: #d97706; }
        .tool-mini-badge.new     { background: #d1fae5; color: #059669; }
        .tool-mini-badge.ai      { background: linear-gradient(135deg,#8b5cf6,#ec4899); color:#fff; }
        .tool-mini-badge.soon    { background: #e0e7ff; color: #4338ca; }

        /* ── Tool visit button ── */
        .tool-visit-btn {
            width: 30px; height: 30px;
            border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text-medium);
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; flex-shrink: 0;
            -webkit-tap-highlight-color: transparent;
        }
        .tool-visit-btn:hover { background: var(--success); color: #fff; border-color: var(--success); }

        /* ── Summary row ── */
        .summary-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px; margin-bottom: 16px;
        }
        .summary-card {
            background: #fff; border: 1.5px solid var(--border);
            border-radius: 12px; padding: 14px;
            display: flex; align-items: center; gap: 10px;
            transition: all 0.2s; position: relative; overflow: hidden;
        }
        .summary-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
        .summary-card:nth-child(1)::before { background: linear-gradient(90deg,#7c3aed,#ec4899); }
        .summary-card:nth-child(2)::before { background: linear-gradient(90deg,#10b981,#059669); }
        .summary-card:nth-child(3)::before { background: linear-gradient(90deg,#ef4444,#dc2626); }
        .summary-card:nth-child(4)::before { background: linear-gradient(90deg,#f59e0b,#f97316); }
        .summary-card:hover { border-color: var(--primary); transform: translateY(-2px); box-shadow: 0 6px 16px rgba(124,58,237,0.08); }
        .summary-card-icon {
            width: 38px; height: 38px; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            color: #fff; flex-shrink: 0; font-size: 15px;
        }
        .summary-card-info { min-width: 0; flex: 1; }
        .summary-card-info strong { display: block; font-size: 19px; font-weight: 800; color: var(--text-dark); line-height: 1; }
        .summary-card-info span   { font-size: 11px; color: var(--text-light); }

        /* ── Tool row override for desktop (5-col) ── */
        @media (min-width: 600px) {
            .tool-row { grid-template-columns: 18px 40px 1fr auto auto auto !important; }
        }

        /* ── Responsive ── */
        @media (max-width: 767px) {
            .summary-row { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 480px) {
            .summary-row { grid-template-columns: repeat(2, 1fr); gap: 8px; }
            .summary-card { padding: 12px; gap: 8px; }
            .summary-card-icon { width: 34px; height: 34px; font-size: 13px; }
            .summary-card-info strong { font-size: 16px; }
            .summary-card-info span { font-size: 10px; }
            .tool-usage { display: none; }
            .category-header { flex-direction: column; align-items: stretch; }
            .category-actions { width: 100%; }
            .category-actions button { flex: 1; justify-content: center; font-size: 10px; padding: 5px 8px; }
        }
        @media (max-width: 360px) {
            .summary-row { grid-template-columns: 1fr 1fr; }
        }
        @media (hover: none) {
            .tool-row, .summary-card, .category-pill {
                -webkit-tap-highlight-color: rgba(124,58,237,0.08);
            }
        }
    </style>
</head>
<body>

<div class="admin-wrapper" id="adminWrapper"></div>

<script src="js/admin.js"></script>
<script>
/* ════════════════════════════════════════
   AUTH CHECK
════════════════════════════════════════ */
if (!AdminAuth.requireAuth()) throw new Error('Not authenticated');

/* ════════════════════════════════════════
   RENDER LAYOUT
════════════════════════════════════════ */
document.getElementById('adminWrapper').innerHTML = `
    ${AdminUI.renderSidebar('tools')}
    <div class="main-content">
        ${AdminUI.renderTopbar('Tools Manager', 'Enable or disable tools on your website')}

        <div class="page-container">

            <!-- SUMMARY CARDS -->
            <div class="summary-row" id="summaryRow"></div>

            <!-- TOOLBAR -->
            <div class="tools-toolbar">
                <div class="search-box" style="flex:1 1 220px;max-width:340px;">
                    <i class="fas fa-search"></i>
                    <input type="search" id="searchInput" placeholder="Search tools..." autocomplete="off">
                </div>
                <button class="btn btn-success btn-sm" type="button" onclick="enableAll()">
                    <i class="fas fa-toggle-on"></i> Enable All
                </button>
                <button class="btn btn-danger btn-sm" type="button" onclick="disableAll()">
                    <i class="fas fa-toggle-off"></i> Disable All
                </button>
                <button class="btn btn-outline btn-sm" type="button" onclick="resetToDefaults()">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>

            <!-- CATEGORY PILLS -->
            <div class="category-pills" id="categoryPills" role="tablist" aria-label="Filter by category"></div>

            <!-- BULK ACTION BAR -->
            <div class="bulk-bar" id="bulkBar" role="toolbar" aria-label="Bulk actions">
                <i class="fas fa-check-circle" aria-hidden="true"></i>
                <span class="bulk-bar-info">
                    <strong id="selectedCount">0</strong> selected
                </span>
                <div class="bulk-bar-actions">
                    <button class="btn btn-sm" type="button" onclick="bulkEnable()">
                        <i class="fas fa-check"></i> Enable
                    </button>
                    <button class="btn btn-sm" type="button" onclick="bulkDisable()">
                        <i class="fas fa-times"></i> Disable
                    </button>
                    <button class="btn btn-sm" type="button" onclick="clearSelection()"
                            style="color:#fff;background:transparent;border:1px solid rgba(255,255,255,0.35);">
                        Cancel
                    </button>
                </div>
            </div>

            <!-- TOOLS LIST -->
            <div id="toolsContainer"></div>

            <!-- EMPTY STATE -->
            <div id="emptyState" class="empty-state" style="display:none;" aria-live="polite">
                <i class="fas fa-search" aria-hidden="true"></i>
                <h3>No tools found</h3>
                <p>Try a different search term or category</p>
                <button class="btn btn-outline" type="button" onclick="setCategory('all');document.getElementById('searchInput').value='';currentSearch='';" style="margin-top:12px;">
                    <i class="fas fa-times"></i> Clear Filter
                </button>
            </div>

            <!-- LIVE SYNC INFO -->
            <div class="card" style="margin-top:16px;background:var(--info-light);border-color:rgba(59,130,246,0.3);">
                <div style="display:flex;gap:10px;align-items:flex-start;">
                    <i class="fas fa-info-circle" style="color:var(--info);font-size:18px;margin-top:1px;flex-shrink:0;" aria-hidden="true"></i>
                    <div style="flex:1;">
                        <strong style="color:var(--info);display:block;margin-bottom:3px;font-size:13px;">
                            ⚡ Live Sync Active
                        </strong>
                        <p style="color:var(--text-medium);font-size:12px;margin:0;line-height:1.5;">
                            Changes reflect on your
                            <a href="${ADMIN_CONFIG.SITE_URL}" target="_blank" rel="noopener noreferrer"
                               style="color:var(--primary);font-weight:700;">website</a>
                            within <strong>2 seconds</strong> via <code style="background:rgba(0,0,0,0.08);padding:1px 5px;border-radius:4px;font-size:11px;">site-tracker.js</code>.
                            Disabled tools automatically show a maintenance page to visitors.
                        </p>
                    </div>
                </div>
            </div>

        </div>
    </div>
`;

AdminUI.initSidebar();
AdminUI.initUserMenu();
AdminUI.startLiveClock();
updateToolsBadge();

/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
let currentCategory = 'all';
let currentSearch   = '';
let selectedTools   = new Set();

/* ════════════════════════════════════════
   RENDER SUMMARY CARDS
════════════════════════════════════════ */
function renderSummary() {
    const tools     = AdminStorage.get(ADMIN_CONFIG.TOOLS_KEY, []);
    const analytics = AdminStorage.get(ADMIN_CONFIG.ANALYTICS_KEY, {});
    const toolUsage = analytics.toolUsage || {};
    const enabled   = tools.filter(t => t.enabled).length;
    const disabled  = tools.length - enabled;
    const totalUse  = Object.values(toolUsage).reduce((a,b) => a + b, 0);

    document.getElementById('summaryRow').innerHTML = `
        <div class="summary-card">
            <div class="summary-card-icon" style="background:linear-gradient(135deg,#7c3aed,#ec4899);">
                <i class="fas fa-th-large"></i>
            </div>
            <div class="summary-card-info">
                <strong>${tools.length}</strong>
                <span>Total Tools</span>
            </div>
        </div>
        <div class="summary-card">
            <div class="summary-card-icon" style="background:linear-gradient(135deg,#10b981,#059669);">
                <i class="fas fa-toggle-on"></i>
            </div>
            <div class="summary-card-info">
                <strong>${enabled}</strong>
                <span>Enabled</span>
            </div>
        </div>
        <div class="summary-card">
            <div class="summary-card-icon" style="background:linear-gradient(135deg,#ef4444,#dc2626);">
                <i class="fas fa-toggle-off"></i>
            </div>
            <div class="summary-card-info">
                <strong>${disabled}</strong>
                <span>Disabled</span>
            </div>
        </div>
        <div class="summary-card">
            <div class="summary-card-icon" style="background:linear-gradient(135deg,#f59e0b,#f97316);">
                <i class="fas fa-fire"></i>
            </div>
            <div class="summary-card-info">
                <strong>${AdminUI.formatNumber(totalUse)}</strong>
                <span>Total Usage</span>
            </div>
        </div>
    `;
}

/* ════════════════════════════════════════
   RENDER CATEGORY PILLS
════════════════════════════════════════ */
function renderCategories() {
    const tools = AdminStorage.get(ADMIN_CONFIG.TOOLS_KEY, []);
    const html  = Object.entries(CATEGORIES).map(([key, cat]) => {
        const count = key === 'all' ? tools.length : tools.filter(t => t.category === key).length;
        if (count === 0 && key !== 'all') return '';
        return `
            <div class="category-pill ${key === currentCategory ? 'active' : ''}"
                 role="tab"
                 aria-selected="${key === currentCategory}"
                 onclick="setCategory('${key}')"
                 tabindex="0"
                 onkeydown="if(event.key==='Enter'||event.key===' ')setCategory('${key}')">
                <i class="fas ${cat.icon}" aria-hidden="true"></i>
                ${cat.name}
                <span class="count">${count}</span>
            </div>
        `;
    }).join('');
    document.getElementById('categoryPills').innerHTML = html;
}

/* ════════════════════════════════════════
   RENDER TOOLS
════════════════════════════════════════ */
function renderTools() {
    const tools     = AdminStorage.get(ADMIN_CONFIG.TOOLS_KEY, []);
    const analytics = AdminStorage.get(ADMIN_CONFIG.ANALYTICS_KEY, {});
    const toolUsage = analytics.toolUsage || {};

    let filtered = tools;
    if (currentCategory !== 'all') {
        filtered = filtered.filter(t => t.category === currentCategory);
    }
    if (currentSearch) {
        const s = currentSearch.toLowerCase();
        filtered = filtered.filter(t =>
            t.name.toLowerCase().includes(s) ||
            t.desc.toLowerCase().includes(s) ||
            t.category.toLowerCase().includes(s) ||
            t.id.toLowerCase().includes(s)
        );
    }

    const container = document.getElementById('toolsContainer');
    const emptyEl   = document.getElementById('emptyState');

    if (filtered.length === 0) {
        container.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
    }
    emptyEl.style.display = 'none';

    // Group by category
    const grouped = {};
    filtered.forEach(t => {
        if (!grouped[t.category]) grouped[t.category] = [];
        grouped[t.category].push(t);
    });

    container.innerHTML = Object.entries(grouped).map(([catKey, catTools]) => {
        const catInfo      = CATEGORIES[catKey] || { name: catKey, icon:'fa-folder', color:'#7c3aed' };
        const enabledCount = catTools.filter(t => t.enabled).length;

        return `
            <div class="category-section">
                <div class="category-header">
                    <h3>
                        <i class="fas ${catInfo.icon}"
                           style="background:linear-gradient(135deg,${catInfo.color},${catInfo.color}cc);
                                  padding:8px;border-radius:8px;width:auto;height:auto;font-size:13px;"></i>
                        ${catInfo.name}
                        <span>${enabledCount}/${catTools.length} active</span>
                    </h3>
                    <div class="category-actions">
                        <button type="button" onclick="enableCategory('${catKey}')" title="Enable all ${catInfo.name}">
                            <i class="fas fa-check" aria-hidden="true"></i>
                            <span>All On</span>
                        </button>
                        <button type="button" onclick="disableCategory('${catKey}')" title="Disable all ${catInfo.name}">
                            <i class="fas fa-times" aria-hidden="true"></i>
                            <span>All Off</span>
                        </button>
                    </div>
                </div>
                ${catTools.map(tool => renderToolRow(tool, toolUsage)).join('')}
            </div>
        `;
    }).join('');
}

function renderToolRow(tool, toolUsage) {
    const usage      = toolUsage[tool.id] || 0;
    const isSelected = selectedTools.has(tool.id);
    const badgeHtml  = tool.badge
        ? `<span class="tool-mini-badge ${tool.badge}">${tool.badge}</span>`
        : '';

    return `
        <div class="tool-row ${!tool.enabled ? 'disabled' : ''}" data-id="${tool.id}">

            <input type="checkbox"
                   class="tool-checkbox"
                   ${isSelected ? 'checked' : ''}
                   aria-label="Select ${tool.name}"
                   onchange="toggleSelect('${tool.id}', this.checked)">

            <div class="tool-icon-box color-${tool.color}" aria-hidden="true">
                <i class="fas ${tool.icon}"></i>
            </div>

            <div class="tool-info">
                <h4>${tool.name} ${badgeHtml}</h4>
                <p>${tool.desc}</p>
            </div>

            <div class="tool-usage" aria-label="${usage} uses">
                <strong>${AdminUI.formatNumber(usage)}</strong>
                <small>uses</small>
            </div>

            <div class="tool-actions">
                <label class="toggle-switch" title="${tool.enabled ? 'Click to disable' : 'Click to enable'}"
                       aria-label="${tool.enabled ? 'Disable' : 'Enable'} ${tool.name}">
                    <input type="checkbox"
                           ${tool.enabled ? 'checked' : ''}
                           onchange="toggleTool('${tool.id}', this.checked)">
                    <span class="toggle-slider"></span>
                </label>
                <button type="button"
                        class="tool-visit-btn"
                        onclick="visitTool('${tool.id}')"
                        title="Open ${tool.name}"
                        aria-label="Open ${tool.name} in new tab">
                    <i class="fas fa-external-link-alt" aria-hidden="true"></i>
                </button>
            </div>
        </div>
    `;
}

/* ════════════════════════════════════════
   CATEGORY FILTER
════════════════════════════════════════ */
window.setCategory = function(cat) {
    currentCategory = cat;
    clearSelection();
    renderCategories();
    renderTools();
    // Smooth scroll to toolbar
    const toolbar = document.querySelector('.tools-toolbar');
    if (toolbar) window.scrollTo({ top: toolbar.offsetTop - 80, behavior: 'smooth' });
};

/* ════════════════════════════════════════
   TOGGLE SINGLE TOOL
════════════════════════════════════════ */
window.toggleTool = function(id, enabled) {
    const tools = AdminStorage.get(ADMIN_CONFIG.TOOLS_KEY, []);
    const tool  = tools.find(t => t.id === id);
    if (!tool) return;

    tool.enabled = enabled;
    AdminStorage.set(ADMIN_CONFIG.TOOLS_KEY, tools);
    AdminStorage.logActivity({
        icon: enabled ? 'fa-toggle-on' : 'fa-toggle-off',
        bg:   enabled ? 'bg-success' : 'bg-warning',
        title:`Tool ${enabled ? 'enabled' : 'disabled'}`,
        meta: tool.name
    });

    AdminUI.toast(`<strong>${tool.name}</strong> ${enabled ? 'enabled ✓' : 'disabled'}`, enabled ? 'success' : 'warning');
    renderSummary();
    renderTools();
    updateToolsBadge();
};

/* ════════════════════════════════════════
   SELECTION
════════════════════════════════════════ */
window.toggleSelect = function(id, checked) {
    if (checked) selectedTools.add(id);
    else         selectedTools.delete(id);
    updateBulkBar();
};

window.clearSelection = function() {
    selectedTools.clear();
    document.querySelectorAll('.tool-checkbox').forEach(cb => cb.checked = false);
    updateBulkBar();
};

function updateBulkBar() {
    const bar   = document.getElementById('bulkBar');
    const count = document.getElementById('selectedCount');
    if (selectedTools.size > 0) {
        bar.classList.add('show');
        count.textContent = selectedTools.size;
    } else {
        bar.classList.remove('show');
    }
}

/* ════════════════════════════════════════
   BULK ACTIONS
════════════════════════════════════════ */
window.bulkEnable = async function() {
    if (!selectedTools.size) return;
    const ok = await AdminUI.confirm({
        title: 'Enable Selected?',
        message: `Enable <strong>${selectedTools.size} tool(s)</strong>?`,
        icon: 'success', iconClass: 'fa-toggle-on',
        confirmText: 'Yes, Enable', cancelText: 'Cancel', confirmClass: 'btn-success',
    });
    if (!ok) return;
    bulkAction(true);
};

window.bulkDisable = async function() {
    if (!selectedTools.size) return;
    const ok = await AdminUI.confirm({
        title: 'Disable Selected?',
        message: `Disable <strong>${selectedTools.size} tool(s)</strong>?`,
        icon: 'danger', iconClass: 'fa-toggle-off',
        confirmText: 'Yes, Disable', cancelText: 'Cancel', confirmClass: 'btn-danger',
    });
    if (!ok) return;
    bulkAction(false);
};

function bulkAction(enable) {
    const tools = AdminStorage.get(ADMIN_CONFIG.TOOLS_KEY, []);
    const count = selectedTools.size;
    tools.forEach(t => { if (selectedTools.has(t.id)) t.enabled = enable; });
    AdminStorage.set(ADMIN_CONFIG.TOOLS_KEY, tools);
    AdminStorage.logActivity({
        icon: enable ? 'fa-toggle-on' : 'fa-toggle-off',
        bg:   enable ? 'bg-success' : 'bg-warning',
        title:`Bulk ${enable ? 'enable' : 'disable'}`,
        meta: `${count} tools affected`
    });
    AdminUI.toast(`${count} tool(s) ${enable ? 'enabled' : 'disabled'}`, enable ? 'success' : 'warning');
    clearSelection();
    renderSummary();
    renderTools();
    updateToolsBadge();
}

/* ════════════════════════════════════════
   CATEGORY ACTIONS
════════════════════════════════════════ */
window.enableCategory = async function(catKey) {
    const catInfo = CATEGORIES[catKey];
    const ok = await AdminUI.confirm({
        title: `Enable ${catInfo.name}?`,
        message: `Enable all tools in <strong>${catInfo.name}</strong>?`,
        icon: 'success', iconClass: 'fa-toggle-on',
        confirmText: 'Yes, Enable', cancelText: 'Cancel', confirmClass: 'btn-success',
    });
    if (!ok) return;
    const tools = AdminStorage.get(ADMIN_CONFIG.TOOLS_KEY, []);
    let count = 0;
    tools.forEach(t => { if (t.category === catKey && !t.enabled) { t.enabled = true; count++; } });
    AdminStorage.set(ADMIN_CONFIG.TOOLS_KEY, tools);
    AdminUI.toast(`${count} ${catInfo.name} tool(s) enabled`, 'success');
    renderSummary(); renderTools(); updateToolsBadge();
};

window.disableCategory = async function(catKey) {
    const catInfo = CATEGORIES[catKey];
    const ok = await AdminUI.confirm({
        title: `Disable ${catInfo.name}?`,
        message: `Disable all tools in <strong>${catInfo.name}</strong>?`,
        icon: 'danger', iconClass: 'fa-toggle-off',
        confirmText: 'Yes, Disable', cancelText: 'Cancel', confirmClass: 'btn-danger',
    });
    if (!ok) return;
    const tools = AdminStorage.get(ADMIN_CONFIG.TOOLS_KEY, []);
    let count = 0;
    tools.forEach(t => { if (t.category === catKey && t.enabled) { t.enabled = false; count++; } });
    AdminStorage.set(ADMIN_CONFIG.TOOLS_KEY, tools);
    AdminUI.toast(`${count} ${catInfo.name} tool(s) disabled`, 'warning');
    renderSummary(); renderTools(); updateToolsBadge();
};

/* ════════════════════════════════════════
   GLOBAL ENABLE / DISABLE / RESET
════════════════════════════════════════ */
window.enableAll = async function() {
    const ok = await AdminUI.confirm({
        title: 'Enable All Tools?',
        message: 'This will <strong>enable all tools</strong> on your website.',
        icon: 'success', iconClass: 'fa-toggle-on',
        confirmText: 'Yes, Enable All', cancelText: 'Cancel', confirmClass: 'btn-success',
    });
    if (!ok) return;
    const tools = AdminStorage.get(ADMIN_CONFIG.TOOLS_KEY, []);
    tools.forEach(t => t.enabled = true);
    AdminStorage.set(ADMIN_CONFIG.TOOLS_KEY, tools);
    AdminStorage.logActivity({ icon:'fa-check-circle', bg:'bg-success', title:'All tools enabled', meta:`${tools.length} tools activated` });
    AdminUI.toast(`All ${tools.length} tools enabled!`, 'success');
    renderSummary(); renderTools(); updateToolsBadge();
};

window.disableAll = async function() {
    const ok = await AdminUI.confirm({
        title: 'Disable All Tools?',
        message: 'This will <strong>hide all tools</strong> from your website.',
        icon: 'danger', iconClass: 'fa-toggle-off',
        confirmText: 'Yes, Disable All', cancelText: 'Cancel', confirmClass: 'btn-danger',
    });
    if (!ok) return;
    const tools = AdminStorage.get(ADMIN_CONFIG.TOOLS_KEY, []);
    tools.forEach(t => t.enabled = false);
    AdminStorage.set(ADMIN_CONFIG.TOOLS_KEY, tools);
    AdminStorage.logActivity({ icon:'fa-times-circle', bg:'bg-danger', title:'All tools disabled', meta:`${tools.length} tools deactivated` });
    AdminUI.toast(`All ${tools.length} tools disabled!`, 'danger');
    renderSummary(); renderTools(); updateToolsBadge();
};

window.resetToDefaults = async function() {
    const ok = await AdminUI.confirm({
        title: 'Reset to Defaults?',
        message: 'This will <strong>restore the default configuration</strong> for all tools.',
        icon: 'warning', iconClass: 'fa-redo',
        confirmText: 'Yes, Reset', cancelText: 'Cancel', confirmClass: 'btn-primary',
    });
    if (!ok) return;
    AdminStorage.set(ADMIN_CONFIG.TOOLS_KEY, DEFAULT_TOOLS);
    AdminStorage.logActivity({ icon:'fa-redo', bg:'bg-info', title:'Tools reset to defaults', meta:'Configuration restored' });
    AdminUI.toast('Tools reset to defaults', 'info');
    renderSummary(); renderCategories(); renderTools(); updateToolsBadge();
};

/* ════════════════════════════════════════
   VISIT TOOL
════════════════════════════════════════ */
window.visitTool = function(id) {
    const tools = AdminStorage.get(ADMIN_CONFIG.TOOLS_KEY, []);
    const tool  = tools.find(t => t.id === id);
    if (tool) window.open(`${ADMIN_CONFIG.SITE_URL}${tool.path}`, '_blank', 'noopener,noreferrer');
};

/* ════════════════════════════════════════
   SEARCH
════════════════════════════════════════ */
let searchTimer;
document.getElementById('searchInput').addEventListener('input', (e) => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
        currentSearch = e.target.value.trim();
        renderTools();
    }, 200);
});

// Clear search on Escape
document.getElementById('searchInput').addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
        document.getElementById('searchInput').value = '';
        currentSearch = '';
        renderTools();
    }
});

/* ════════════════════════════════════════
   LIVE SYNC (cross-tab)
════════════════════════════════════════ */
window.addEventListener('storage', (e) => {
    if (e.key === ADMIN_CONFIG.TOOLS_KEY || e.key === ADMIN_CONFIG.ANALYTICS_KEY) {
        renderSummary();
        renderTools();
        updateToolsBadge();
    }
});
window.addEventListener('admin-storage-change', () => {
    renderSummary();
    renderTools();
    updateToolsBadge();
});

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */
renderSummary();
renderCategories();
renderTools();
</script>
