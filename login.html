<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coming Soon</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'><stop offset='0%25' stop-color='%237c3aed'/><stop offset='100%25' stop-color='%230ea5e9'/></linearGradient></defs><rect width='100' height='100' rx='18' fill='url(%23g)'/><text x='50' y='38' text-anchor='middle' font-size='28' font-weight='800' fill='white' font-family='Arial'>PDF</text><text x='50' y='72' text-anchor='middle' font-size='22' font-weight='600' fill='rgba(255,255,255,0.85)' font-family='Arial'>Tools</text></svg>" type="image/svg+xml">
    <meta name="description" content="Login to PDFTools - Save your preferences and history.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/tool-page.css">
  
  <style>
    .page-wrap {
        max-width: 480px;
        margin: 0 auto;
        padding: 25px 20px 60px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .back-btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--primary);
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 20px;
        transition: color 0.2s;
    }
    .back-btn:hover { color: var(--primary-dark); }

    /* Hero */
    .login-hero {
        text-align: center;
        padding: 20px 20px 10px;
    }
    .login-hero .hero-icon {
        width: 75px;
        height: 75px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 18px;
        font-size: 30px;
        color: #fff;
        box-shadow: 0 12px 35px rgba(99,102,241,0.3);
    }
    .login-hero h1 {
        font-size: 28px;
        font-weight: 800;
        margin-bottom: 8px;
    }
    .login-hero h1 span {
        background: linear-gradient(135deg, var(--primary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }
    .login-hero p {
        font-size: 14px;
        color: var(--text-medium);
        line-height: 1.6;
    }

    .optional-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 16px;
        background: rgba(34,197,94,0.08);
        border: 1px solid rgba(34,197,94,0.2);
        border-radius: 50px;
        font-size: 12px;
        font-weight: 600;
        color: #16a34a;
        margin-top: 12px;
    }

    /* Hide old login UI */
    .auth-tabs,
    .google-btn,
    .divider,
    .auth-form,
    .forgot-link,
    .auth-error,
    .auth-success,
    .benefits-card,
    .no-login-note,
    .user-profile {
        display: none !important;
    }

    /* Coming Soon Card */
    .login-card {
        background: rgba(255,255,255,0.55);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255,255,255,0.55);
        border-radius: 20px;
        padding: 32px 24px;
        margin-top: 22px;
        text-align: center;
        box-shadow: 0 12px 35px rgba(99,102,241,0.12);
    }

    .coming-soon-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
    }

    .coming-soon-icon {
        width: 68px;
        height: 68px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(99,102,241,0.12), rgba(168,85,247,0.14));
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
        font-size: 28px;
    }

    .coming-soon-content h2 {
        font-size: 22px;
        font-weight: 800;
        color: var(--text-dark);
        margin: 0;
    }

    .coming-soon-content p {
        font-size: 14px;
        color: var(--text-medium);
        line-height: 1.7;
        margin: 0;
        max-width: 320px;
    }

    .coming-home-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 6px;
        padding: 13px 20px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: #fff;
        text-decoration: none;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .coming-home-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(99,102,241,0.35);
    }

    @media (max-width: 480px) {
        .login-card { padding: 24px 18px; }
        .login-hero h1 { font-size: 24px; }
        .coming-soon-content h2 { font-size: 20px; }
    }
</style>
</head>
<body>
 <div class="page-wrap">
    

    <div class="login-hero">
        <div class="hero-icon">
            <i class="fas fa-clock"></i>
        </div>
        <h1><span>Coming Soon</span></h1>
        <p>This login feature is currently under development and will be available soon.</p>

        <div class="optional-badge">
            <i class="fas fa-tools"></i>
            Under Development
        </div>
    </div>

    <div class="login-card">
        <div class="coming-soon-content">
            <div class="coming-soon-icon">
                <i class="fas fa-user-lock"></i>
            </div>

            <h2>Login Page Coming Soon</h2>
            <p>
                We are working on a secure and smooth login experience.
                Please check back again soon.
            </p>

            <a href="/" class="coming-home-btn">
                <i class="fas fa-home"></i>
                Go to Home
            </a>
        </div>
    </div>
</div>
</body>
</html>
